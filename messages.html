
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnecFriend | Messages</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
    <nav class="main-navbar">
        <a href="home.html" class="nav-brand">
            <span class="nav-logo"><i class="bi bi-people-fill"></i></span>
            <span>ConnecFriend</span>
        </a>

        <div class="nav-links">
            <a href="home.html" class="nav-link">Home</a>
            <a href="profile.html" class="nav-link">My Profile</a>
            <a href="messages.html" class="nav-link active">Messages</a>
        </div>

        <div class="nav-user">
            <span id="navUsername">Member</span>
            <a href="index.html" id="logoutButton" class="logout-link">Sign out</a>
        </div>
    </nav>

    <main class="home-container">
        <section class="home-banner">
            <div>
                <p class="banner-label">PRIVATE CONVERSATIONS</p>
                <h1>Your Messages</h1>
                <p>Choose a member and start a conversation.</p>
            </div>
            <div class="banner-icon"><i class="bi bi-chat-dots"></i></div>
        </section>

        <section class="content-card p-3 p-md-4">
            <label for="chatWith" class="form-label fw-semibold">Message a member</label>
            <select id="chatWith" class="form-select mb-4">
                <option value="">Select a member</option>
            </select>

            <div id="messages" class="border rounded p-3 mb-3"
                style="min-height: 250px; max-height: 450px; overflow-y: auto;">
                <p class="text-secondary">Select a member to view messages.</p>
            </div>

            <form id="messageForm">
                <label for="messageText" class="form-label">Your message</label>
                <textarea id="messageText" class="form-control mb-3"
                    rows="3" placeholder="Write a message..." required></textarea>
                <button type="submit" class="share-btn">
                    <i class="bi bi-send"></i> Send message
                </button>
                <p id="chatMsg" class="form-message" aria-live="polite"></p>
            </form>
        </section>

        <footer class="home-footer">
            <span>ConnecFriend</span>
            <span>Connect. Share. Belong.</span>
        </footer>
    </main>

    <script src="data.js"></script>
    <script src="chat.js"></script>
</body>
</html>
