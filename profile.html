
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnecFriend | My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="home-page">
    <nav class="main-navbar">
        <a href="home.html" class="nav-brand">
            <span class="nav-logo"><i class="bi bi-people-fill"></i></span>
            <span>ConnecFriend</span>
        </a>

        <div class="nav-links">
            <a href="home.html" class="nav-link">Home</a>
            <a href="profile.html" class="nav-link active">My Profile</a>
            <a href="messages.html" class="nav-link">Messages</a>
        </div>

        <div class="nav-user">
            <span id="navUsername">Member</span>
            <a href="index.html" id="logoutButton" class="logout-link">Sign out</a>
        </div>
    </nav>

    <main class="home-container">
        <section class="home-banner">
            <div>
                <p class="banner-label">YOUR ACCOUNT</p>
                <h1>My Profile</h1>
                <p>Your personal information and connections.</p>
            </div>
            <div class="banner-icon"><i class="bi bi-person-circle"></i></div>
        </section>

        <section class="content-card p-4 mb-4">
            <div class="d-flex flex-column flex-sm-row align-items-center gap-4">
                <img id="profilePic" src="" alt="Profile picture"
                    class="rounded-circle" width="110" height="110"
                    style="object-fit: cover;">

                <div class="text-center text-sm-start">
                    <h2 id="name" class="h3 mb-1">Member</h2>
                    <p id="profileUsername" class="text-secondary mb-0">@username</p>
                </div>
            </div>

            <hr>

            <h3 class="h5 mb-3">Personal information</h3>
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="p-3 rounded bg-light">
                        <small class="text-secondary d-block">Phone</small>
                        <span id="phone">Not provided</span>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="p-3 rounded bg-light">
                        <small class="text-secondary d-block">Email</small>
                        <span id="email">Not provided</span>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="p-3 rounded bg-light">
                        <small class="text-secondary d-block">City</small>
                        <span id="city">Not provided</span>
                    </div>
                </div>
            </div>
        </section>

        <section class="content-card p-4">
            <div class="section-title">
                <h2>My friends</h2>
                <a href="home.html#peopleSection" class="btn btn-sm btn-outline-primary">Find people</a>
            </div>
            <div id="profileFriends" class="row g-3"></div>
        </section>

        <footer class="home-footer">
            <span>ConnecFriend</span>
            <span>Connect. Share. Belong.</span>
        </footer>
    </main>

    <script src="data.js"></script>
    <script src="profile.js"></script>
</body>
</html>
